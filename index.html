<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBD Sondos!</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/main.js" defer></script>
</head>

<body>
    <audio src="./assets/birthday-song.mp3" preload="auto" id="birthdayCat" type="audio/mp3"></audio>
    <div id="overlay">
        <button id="playBtn"
            style="padding: 15px 30px; font-size: 20px; background: #ff69b4; color: white; border: none; border-radius: 10px; cursor: pointer;">
            🎂 Open the Birthday Card! 🎉
        </button>
    </div>
    <section>
        <h1>Happy birthday Sondos! </h1>
        <div class="one">
            <div class="birthday-cake">
                <div class="holder"></div>
                <div class="cake-shadow"></div>
                <div class="cake">
                    <div class="chocolate"></div>
                </div>
                <div class="candle"></div>
                <div class="flame"></div>
            </div>
        </div>
    </section>

    <section>
        <div class="two">
            <div class="gift-container">
                <div class="shadow"></div>
                <div class="gift-box">
                    <div class="video-wrapper">
                        <video class="short-video" src="./assets/Video Project 8.mp4" playsinline></video>
                    </div>
                    <div class="click"></div>
                </div>
            </div>
        </div>
    </section>
    <h2>Open your gift!</h2>
</body>

</html>
